
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulation médicale VR</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    #notice {
      position: fixed;
      z-index: 10;
      top: 10px;
      left: 10px;
      padding: 10px 14px;
      background: #12352f;
      color: white;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="notice">
    Simulation fictive — pointez un objet et appuyez sur la gâchette.
  </div>

  <a-scene
    background="color: #DCEAF2"
    renderer="colorManagement: true"
    webxr="optionalFeatures: hand-tracking"
  >
    <!-- Lumière et environnement -->
    <a-entity light="type: ambient; intensity: 1.1"></a-entity>
    <a-entity
      light="type: directional; intensity: 1.5"
      position="-2 5 3"
    ></a-entity>

    <a-plane
      rotation="-90 0 0"
      width="10"
      height="10"
      color="#D6E2E8"
    ></a-plane>

    <a-box
      position="0 2.5 -4.8"
      width="10"
      height="5"
      depth="0.1"
      color="#F4F7F9"
    ></a-box>

    <!-- Panneau d'instructions -->
    <a-plane
      position="0 2.8 -3.9"
      width="3.5"
      height="0.9"
      color="#173D56"
    ></a-plane>

    <a-text
      value="SIMULATION MEDICALE"
      position="0 3.02 -3.85"
      align="center"
      width="3.2"
      color="#FFFFFF"
    ></a-text>

    <a-text
      id="progress"
      value="Etapes : 0 / 4"
      position="0 2.72 -3.85"
      align="center"
      width="3"
      color="#B9F4DC"
    ></a-text>

    <a-plane
      position="0 2.05 -3.9"
      width="3.8"
      height="0.65"
      color="#FFFFFF"
    ></a-plane>

    <a-text
      id="message"
      value="Pointez le patient, le moniteur, l'hygiene ou la synthese."
      position="0 2.05 -3.85"
      align="center"
      baseline="center"
      width="3.5"
      color="#173D56"
      wrap-count="43"
    ></a-text>

    <!-- Lit du patient -->
    <a-box
      position="-1.35 0.75 -2.45"
      width="2.1"
      height="0.22"
      depth="1.15"
      color="#FFFFFF"
    ></a-box>

    <a-box
      position="-1.35 0.48 -2.45"
      width="1.8"
      height="0.35"
      depth="0.9"
      color="#91A9B8"
    ></a-box>

    <!-- Patient : jambes -->
    <a-cylinder
      position="-1.65 0.95 -2.15"
      radius="0.12"
      height="0.65"
      color="#D5A17C"
      rotation="0 0 90"
    ></a-cylinder>

    <a-cylinder
      position="-1.65 0.95 -2.65"
      radius="0.12"
      height="0.65"
      color="#D5A17C"
      rotation="0 0 90"
    ></a-cylinder>

    <!-- Corps du patient : OBJET CLIQUABLE -->
    <a-box
      id="patient"
      class="clickable"
      data-action="patient"
      data-base-color="#4B91B8"
      position="-1.05 1.22 -2.45"
      width="0.85"
      height="0.4"
      depth="0.65"
      color="#4B91B8"
    ></a-box>

    <!-- Tête du patient -->
    <a-sphere
      position="-0.45 1.3 -2.45"
      radius="0.22"
      color="#D5A17C"
    ></a-sphere>

    <a-text
      value="PATIENT"
      position="-1.25 1.85 -2.45"
      align="center"
      width="2"
      color="#173D56"
    ></a-text>

    <!-- Moniteur -->
    <a-box
      position="1.45 1.35 -2.6"
      width="0.85"
      height="0.75"
      depth="0.15"
      color="#344955"
    ></a-box>

    <!-- Ecran cliquable -->
    <a-box
      id="moniteur"
      class="clickable"
      data-action="moniteur"
      data-base-color="#173D56"
      position="1.45 1.38 -2.5"
      width="0.68"
      height="0.52"
      depth="0.025"
      color="#173D56"
    ></a-box>

    <a-text
      value="FC  78"
      position="1.45 1.49 -2.47"
      align="center"
      width="1.3"
      color="#55FFAA"
    ></a-text>

    <a-text
      value="SpO2  98%"
      position="1.45 1.3 -2.47"
      align="center"
      width="1.3"
      color="#55FFAA"
    ></a-text>

    <a-text
      value="MONITEUR"
      position="1.45 1.95 -2.6"
      align="center"
      width="2"
      color="#173D56"
    ></a-text>

    <!-- Poste d'hygiene -->
    <a-box
      position="-2.65 0.8 -1.1"
      width="0.8"
      height="0.9"
      depth="0.5"
      color="#D9E4EA"
    ></a-box>

    <a-box
      id="hygiene"
      class="clickable"
      data-action="hygiene"
      data-base-color="#27A6A1"
      position="-2.65 1.0 -0.82"
      width="0.58"
      height="0.48"
      depth="0.06"
      color="#27A6A1"
    ></a-box>

    <a-text
      value="HYGIENE"
      position="-2.65 1.65 -1.1"
      align="center"
      width="2"
      color="#173D56"
    ></a-text>

    <a-text
      value="Cliquer"
      position="-2.65 1.0 -0.77"
      align="center"
      width="1.5"
      color="#FFFFFF"
    ></a-text>

    <!-- Poste de synthese -->
    <a-box
      position="2.55 0.8 -1.1"
      width="0.9"
      height="0.9"
      depth="0.5"
      color="#D9E4EA"
    ></a-box>

    <a-box
      id="synthese"
      class="clickable"
      data-action="synthese"
      data-base-color="#D9A441"
      position="2.55 1.0 -0.82"
      width="0.65"
      height="0.48"
      depth="0.06"
      color="#D9A441"
    ></a-box>

    <a-text
      value="SYNTHESE"
      position="2.55 1.65 -1.1"
      align="center"
      width="2"
      color="#173D56"
    ></a-text>

    <a-text
      value="Cliquer"
      position="2.55 1.0 -0.77"
      align="center"
      width="1.5"
      color="#FFFFFF"
    ></a-text>

    <!-- Camera et clic souris sur ordinateur -->
    <a-entity position="0 1.6 0">
      <a-camera look-controls="pointerLockEnabled: false">
        <a-entity
          cursor="rayOrigin: mouse"
          raycaster="objects: .clickable; far: 10"
        ></a-entity>
      </a-camera>
    </a-entity>

    <!-- Controleur droit -->
    <a-entity
      laser-controls="hand: right"
      raycaster="objects: .clickable; far: 10"
      line="color: #00FFFF; opacity: 0.9"
    ></a-entity>

    <!-- Controleur gauche -->
    <a-entity
      laser-controls="hand: left"
      raycaster="objects: .clickable; far: 10"
      line="color: #00FFFF; opacity: 0.9"
    ></a-entity>

  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");

    function initialiserInteractions() {
      const message = document.querySelector("#message");
      const progress = document.querySelector("#progress");

      const etapes = {
        patient: {
          titre: "Patient",
          texte: "Patient selectionne. Simulation fictive : observez la scene."
        },
        moniteur: {
          titre: "Moniteur",
          texte: "Moniteur ouvert. Valeurs fictives : FC 78, SpO2 98 %."
        },
        hygiene: {
          titre: "Hygiene",
          texte: "Poste d'hygiene selectionne. Suivez le protocole enseigne."
        },
        synthese: {
          titre: "Synthese",
          texte: "Synthese ouverte. Revisez les observations de la simulation."
        }
      };

      const realisees = new Set();

      document.querySelectorAll(".clickable").forEach((objet) => {
        // Curseur ou rayon sur l'objet
        objet.addEventListener("mouseenter", () => {
          objet.setAttribute("scale", "1.08 1.08 1.08");
        });

        objet.addEventListener("mouseleave", () => {
          objet.setAttribute("scale", "1 1 1");
        });

        // Declenchement par clic ou gachette VR
        objet.addEventListener("click", () => {
          const action = objet.getAttribute("data-action");
          const etape = etapes[action];

          if (!etape) return;

          message.setAttribute("value", etape.texte);

          if (!realisees.has(action)) {
            realisees.add(action);
            progress.setAttribute(
              "value",
              "Etapes : " + realisees.size + " / 4"
            );
          }

          objet.setAttribute("material", "emissive", "#164B3A");
          console.log("Objet selectionne :", etape.titre);
        });
      });

      console.log("Interactions medicales initialisees.");
    }

    if (scene.hasLoaded) {
      initialiserInteractions();
    } else {
      scene.addEventListener("loaded", initialiserInteractions);
    }
  </script>
</body>
</html>
