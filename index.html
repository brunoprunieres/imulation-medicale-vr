<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Scénario VR - Simulation Médicale</title>
    <!-- Import d'A-Frame et du composant d'animation -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
      // Logique interactive pour gérer l'affichage séquentiel (Info -> Bouton suivant -> Entrée salle)
      AFRAME.registerComponent('scenario-interactif', {
        init: function () {
          var infoIcon = document.querySelector('#info-icon');
          var infoPanel = document.querySelector('#info-panel');
          var closeInfoBtn = document.querySelector('#close-info-btn');
          var doorIcon = document.querySelector('#door-icon');
          var sky = document.querySelector('a-sky');

          // 1. Quand on clique sur l'icône d'info
          infoIcon.addEventListener('click', function () {
            infoPanel.setAttribute('visible', 'true');
            closeInfoBtn.setAttribute('visible', 'true');
            infoIcon.setAttribute('visible', 'false'); // Cache l'icône info
          });

          // 2. Quand on clique pour fermer l'info lue
          closeInfoBtn.addEventListener('click', function () {
            infoPanel.setAttribute('visible', 'false');
            closeInfoBtn.setAttribute('visible', 'false');
            // Fait apparaître l'icône pour entrer dans la salle
            doorIcon.setAttribute('visible', 'true');
          });

          // 3. Quand on clique sur l'icône pour entrer dans la nouvelle salle
          doorIcon.addEventListener('click', function () {
            // Remplace l'image du couloir par l'image de l'intérieur de la salle (ou une autre image)
            sky.setAttribute('src', '#salle-interieure');
            doorIcon.setAttribute('visible', 'false');
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene scenario-interactif>
      <a-assets>
        <!-- Image 360 du couloir (générée ou votre propre photo) -->
        <img id="couloir" src="

http://googleusercontent.com/image_generation_content/21_881

" crossorigin="anonymous">
        <!-- Image 360 de l'intérieur de la salle de simulation -->
        <img id="salle-interieure" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/city.jpg" crossorigin="anonymous">
      </a-assets>

      <!-- Fond 360 initial (le couloir) -->
      <a-sky src="#couloir"></a-sky>

      <!-- ÉTAPE 1 : Icône d'information placée à côté de la porte -->
      <a-entity id="info-icon" position="-0.8 1.5 -2.5" rotation="0 15 0">
        <a-circle radius="0.2" color="#0077FF" animation="property: scale; to: 1.15 1.15 1.15; dur: 800; dir: alternate; loop: true">
          <a-text value="i" align="center" position="0 0 0.01" scale="1.5 1.5 1.5" color="#FFF"></a-text>
        </a-circle>
        <a-text value="Consignes de la seance" position="0 0.3 0" align="center" width="2" color="#FFF"></a-text>
      </a-entity>

      <!-- Panneau de texte explicatif (initialement invisible) -->
      <a-entity id="info-panel" position="0 1.6 -2" visible="false">
        <a-plane width="2.5" height="1.2" color="#111" opacity="0.9"></a-plane>
        <a-text value="Bienvenue dans la salle de simulation.\nVeuillez verifier votre equipement\net respecter les procedures d'hygiene\navant d'entrer." 
                position="0 0.1 0.05" align="center" width="2.2" color="#FFF" font="roboto"></a-text>
      </a-entity>

      <!-- Bouton de fermeture du texte (initialement invisible) -->
      <a-entity id="close-info-btn" position="0 1.05 -2" visible="false">
        <a-box width="0.8" height="0.3" depth="0.05" color="#4CAF50"></a-box>
        <a-text value="J'ai lu" position="0 0 0.04" align="center" width="1.5" color="#FFF"></a-text>
      </a-entity>

      <!-- ÉTAPE 2 : Icône d'entrée de porte (initialement invisible, apparaît après la lecture) -->
      <a-entity id="door-icon" position="0 1.3 -2.5" visible="false" animation="property: scale; to: 1.15 1.15 1.15; dur: 800; dir: alternate; loop: true">
        <a-circle radius="0.25" color="#FF5722">
          <a-text value="Entrer" align="center" position="0 0 0.01" scale="0.8 0.8 0.8" color="#FFF"></a-text>
        </a-circle>
      </a-entity>

      <!-- Caméra et curseur d'interaction compatibles Quest 2 (via le regard ou les manettes) -->
      <a-entity camera look-controls position="0 1.6 0">
        <a-cursor fuse="true" fuse-timeout="1000" color="#FFFFFF"></a-cursor>
      </a-entity>
    </a-scene>
  </body>
</html>
